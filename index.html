<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilith CLI Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for a command-line feel */
        @import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap');

        body {
            font-family: 'Inconsolata', monospace;
            background-image: url('1000009457.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .terminal-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: #010409;
            border-radius: 0.5rem;
            box-shadow: 0 4px 10px rgba(0, 255, 0, 0.2);
            border: 1px solid #238636;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #output {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.5;
            scrollbar-color: #238636 #010409;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #238636;
            padding: 0.5rem 1rem;
            background-color: #010409;
        }

        .prompt-prefix {
            color: #238636;
            margin-right: 0.5rem;
            white-space: nowrap;
        }

        #commandInput {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #c9d1d9;
            outline: none;
            padding: 0;
            font-size: 1rem;
        }

        .response-text {
            color: #fff;
            margin-bottom: 1rem;
        }

        .loading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 0 2px;
            border-radius: 50%;
            background-color: #238636;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        #startupOverlay {
            background-image: url('1000009468.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .startup-button {
            background-image: url('1000009468.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s;
        }

        .startup-button:hover {
            background-image: url('1000009457.png');
        }
    </style>
</head>
<body>

    <div id="startupOverlay" class="fixed inset-0 flex flex-col items-center justify-center z-50 text-white">
        <h1 class="text-4xl font-bold text-green-400 mb-8">Lilith CLI Interface</h1>
        <button onclick="startApp()" class="startup-button px-8 py-4 text-lg font-bold rounded-xl transition duration-300 shadow-lg ring ring-green-400 ring-opacity-50">
            WAKE SERVER / initialize LILITH_CLI interface.
        </button>
    </div>

    <div class="terminal-container">
        <div id="output" class="text-sm">
            <p class="text-green-500 font-bold mb-4">
                [ Lilith CLI v1.0.0 ] start interface...
            </p>
        </div>

        <div class="input-area">
            <div class="prompt-prefix">lilith_cli $</div>
            <input type="text" id="commandInput" placeholder="Ask me anything..." disabled>
        </div>

        <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center z-50">
            <div class="bg-gray-800 p-6 rounded-lg shadow-xl max-w-sm w-full border border-red-500">
                <h3 class="text-xl font-bold mb-4 text-red-400">Error</h3>
                <p id="alertMessage" class="text-sm mb-6 text-gray-300"></p>
                <button onclick="document.getElementById('alertModal').classList.add('hidden')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- LLM Text Generation Configuration ---
        const API_URL = 'https://lilith-cli.onrender.com/generate';

        // --- DOM Elements ---
        const output = document.getElementById('output');
        const input = document.getElementById('commandInput');
        const modal = document.getElementById('alertModal');
        const modalMessage = document.getElementById('alertMessage');
        const startupOverlay = document.getElementById('startupOverlay');
        let isProcessing = false;

        // --- Core Terminal Logic ---

        function showAlert(message) {
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function appendOutput(text, type) {
            const line = document.createElement('div');
            line.classList.add('text-sm');

            if (type === 'user') {
                line.innerHTML = `<span class="prompt-prefix">lilith_cli $</span><span class="text-gray-400">${text}</span>`;
            } else if (type === 'system') {
                const formattedText = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
                line.innerHTML = `<div class="response-text">${formattedText}</div>`;
            }
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function showLoading() {
            const loaderDiv = document.createElement('div');
            loaderDiv.id = 'loadingIndicator';
            loaderDiv.className = 'response-text mt-2 mb-4';
            loaderDiv.innerHTML = 'Lilith is processing...' +
                '<span class="loading-dot"></span>' +
                '<span class="loading-dot"></span>' +
                '<span class="loading-dot"></span>';
            output.appendChild(loaderDiv);
            output.scrollTop = output.scrollHeight;
        }

        function hideLoading() {
            const loaderDiv = document.getElementById('loadingIndicator');
            if (loaderDiv) {
                loaderDiv.remove();
            }
        }

        async function handlePrompt(prompt) {
            if (isProcessing) return;

            isProcessing = true;
            input.disabled = true;

            appendOutput(prompt, 'user');
            input.value = '';
            showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (data.error) {
                    appendOutput(`ERROR: ${data.error}`, 'system');
                    showAlert(`Server Error: ${data.error}`);
                } else if (data.response) {
                    appendOutput(data.response, 'system');
                } else {
                    appendOutput("ERROR: Received an invalid response from the server.", 'system');
                    showAlert("Invalid server response format.");
                }

            } catch (error) {
                console.error('Fetch error:', error);
                const errorMessage = `Failed to connect to backend service. Error: ${error.message}. Please check server health at ${API_URL}`;
                appendOutput(errorMessage, 'system');
                showAlert(errorMessage);
            } finally {
                hideLoading();
                isProcessing = false;
                input.disabled = false;
                input.focus();
            }
        }

        function startApp() {
            startupOverlay.classList.add('hidden');
            input.disabled = false;
            input.focus();

            // Quiet background ping to wake up the Render backend instantly
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: "ping" })
            }).catch(() => {});

            output.innerHTML = '';
            const welcomeText = "This is the Lilith Command Line Interface. I am ready for your queries.";
            appendOutput(welcomeText, 'system');
        }

        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && input.value.trim() !== '') {
                handlePrompt(input.value.trim());
            }
        });
    </script>
</body>
</html>
